ShortDescription: See yourself the way the web sees you — multi-source IP checks, egress diagnostics and exposure audit
Description: IP Insight checks one machine's network environment against multiple independent sources: four-source cross-validation of IP profile and risk, plus the real egress, CDN edge node and DNS exit per site. Since 0.3.1 it also shows what a website can read without permission — 157 signals, fingerprint stability, 13 evidence-based disguise checks, a target-region simulator, traceroute / network diagnostics / CDN radar. No built-in IP database, no telemetry, MIT licensed.
