name: Build Windows

# 两种触发方式：
# 1. 手动：Actions 页面点 "Run workflow"，构建完成后在 Artifacts 下载；
# 2. 打 tag：推送 v* 标签（如 v0.3.1）时自动构建，并创建草稿 Release 挂上产物，人工确认后发布。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck:node; npm run typecheck:web

      - name: Build Windows installer + portable
        run: |
          npm run build
          npx electron-builder --win --publish never
          node scripts/finalize-release.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IP-Insight-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/SHA256SUMS.txt
            release/latest.yml
          if-no-files-found: error

      - name: Attach assets to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/IP-Insight-*-Setup.exe
            release/IP-Insight-*-Setup.exe.blockmap
            release/IP-Insight-Portable.zip
            release/latest.yml
            release/SHA256SUMS.txt
